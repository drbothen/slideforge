[package]
name = "s4-chumsky-indent-parser"
version = "0.1.0"
edition = "2024"
# Standalone spike binary — NOT part of the slideforge workspace.

[workspace]  # Isolate from parent workspace

[[bin]]
name = "s4_demo"
path = "src/main.rs"

[[bin]]
name = "s4_bench"
path = "src/bench.rs"

[dependencies]
# chumsky 0.10.x — confirmed stable, NOT the 1.0.0-alpha line.
# "0.10" resolves to the latest 0.10.x patch (currently 0.10.1).
# The 1.0.0-alpha.* versions are pre-releases and are NOT matched by "0.10".
chumsky = "0.10"

[dev-dependencies]
# No additional test deps needed for spike
