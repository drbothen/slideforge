# rustfmt config for the slideforge workspace.
#
# Only stable rustfmt options are used here so that `cargo fmt` works on
# the stable toolchain without requiring nightly. Additional nightly-only
# options are listed in comments at the bottom for future enablement once
# they stabilize.

edition = "2024"
max_width = 100
tab_spaces = 4
newline_style = "Unix"

use_field_init_shorthand = true
use_try_shorthand = true
remove_nested_parens = true

# Function and struct formatting
fn_params_layout = "Tall"   # one parameter per line if it doesn't fit
match_block_trailing_comma = true

# Comments
normalize_comments = true
wrap_comments = false       # Don't auto-wrap // comments; lets us keep ASCII art.

# Strings
format_strings = false      # Don't auto-wrap string literals.

# ---------------------------------------------------------------------------
# Nightly-only options (DO NOT enable on stable; rustfmt will warn or fail).
# Once these stabilize, consider adding them:
#
#   imports_granularity = "Crate"
#   group_imports = "StdExternalCrate"
#   reorder_impl_items = true
#   format_code_in_doc_comments = true
#   condense_wildcard_suffixes = true
#   normalize_doc_attributes = true
# ---------------------------------------------------------------------------
