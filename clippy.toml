# Clippy configuration for the slideforge workspace.
#
# Thresholds are tuned slightly more permissive than the defaults to
# accommodate parser/exporter code that is naturally a bit denser.

# Minimum supported Rust version. Clippy warns about features
# unavailable in this version.
msrv = "1.88"

# Cognitive complexity threshold (default 25).
# Parser combinator chains can exceed the default; we allow a bit more.
cognitive-complexity-threshold = 30

# Maximum function arguments before clippy warns (default 7).
# Slide builder helpers occasionally exceed 7 (e.g. positioning helpers).
too-many-arguments-threshold = 8

# Maximum lines in a function before clippy warns (default 100).
too-many-lines-threshold = 150

# Type complexity threshold (default 250).
# Chumsky parser types are naturally complex.
type-complexity-threshold = 300

# Stack array threshold (default 512000 bytes = 512 KB).
# We have no need for very large stack arrays; leave default.
array-size-threshold = 512000

# Documentation thresholds
single-char-binding-names-threshold = 4
