[package]
name = "slideforge-plugin-api"
description = "Plugin trait API for slideforge — the 10 extension surfaces all bundled and external plugins implement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "slideforge_plugin_api"

[dependencies]
# All production deps pinned with `=` per supply-chain policy.
slideforge-types.workspace = true
slideforge-layout = { workspace = true }
thiserror = { workspace = true }
strsim = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# ordered-float: needed for constructing Value::Float(...) in color-coded slide type tests (STORY-087)
ordered-float = { workspace = true }
# tracing-test: load-bearing test capturing tracing::debug! for Footnote deferral log (F-010 / STORY-085)
tracing-test = "=0.2.5"
