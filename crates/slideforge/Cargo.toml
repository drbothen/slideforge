[package]
name = "slideforge"
description = "Compile a structured DSL into branded PowerPoint presentations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
# Pipeline orchestration (ADR-016 Decision 3: root crate IS the pipeline driver)
slideforge-syntax = { workspace = true }
slideforge-eval = { workspace = true }
slideforge-layout = { workspace = true }
slideforge-validate = { workspace = true }

# Plugin API — PluginRegistry, PluginRegistryBuilder, RegistryError, all 10 trait surfaces
slideforge-plugin-api = { workspace = true }

# Bundled plugin implementations — one entry per surface
slideforge-data = { workspace = true }
slideforge-pptx = { workspace = true }
slideforge-docx = { workspace = true }
slideforge-pdf = { workspace = true }
slideforge-charts = { workspace = true }
slideforge-diagrams = { workspace = true }
slideforge-math = { workspace = true }
slideforge-brand = { workspace = true }
# slideforge-html: STORY-046 AC-001 — registered here per Dependency Anchor Justification.
# HtmlExporter is the Exporter implementation for the "html" format.
slideforge-html = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Diagnostics rendering for CLI errors
miette = { workspace = true }

# Structured logging — pipeline stage diagnostics (CLAUDE.md: no println! in library crates)
tracing = { workspace = true }

[dev-dependencies]
# External plugin test (STORY-049 AC-007) needs slideforge-types for test Value instances.
slideforge-types = { workspace = true }
# Plugin API trait access for external plugin dog-fooding test and STORY-050 E2E tests.
slideforge-plugin-api = { workspace = true }

# STORY-050 E2E test dependencies.
# tracing-test: capture tracing events for AC-007 observability assertions.
# no-env-filter: required for integration tests (tests/ crate) to capture INFO events
# from the slideforge production crate. Without it, the env_filter uses the integration
# test crate name ("e2e_tests") as the target prefix, which does not match the
# production "slideforge::lib" target (STORY-050 Gap 3 / AC-007).
tracing-test = { version = "=0.2.5", features = ["no-env-filter"] }
# zip: validate PPTX/DOCX ZIP structure (AC-001, AC-002, AC-008).
# Same feature set as slideforge-pptx to avoid lzma conflict.
zip = { version = "=4.2.0", default-features = false, features = ["deflate", "time"] }
