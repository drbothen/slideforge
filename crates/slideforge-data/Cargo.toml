[package]
name = "slideforge-data"
description = "DataSource plugin implementations for slideforge — JSON, CSV, YAML, TOML file loading and HTTP/HTTPS sources with SSRF allowlist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "slideforge_data"

[dependencies]
# All production deps pinned with `=` per supply-chain policy (NFR-025).
slideforge-types.workspace = true
slideforge-plugin-api.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
csv = "=1.3.1"
serde_yaml_ng = "=0.10.0"
toml = { version = "=0.8.23", features = ["preserve_order"] }
thiserror.workspace = true
indexmap = { version = "=2.9.0", features = ["std"] }
ordered-float = "=4.6.0"
ureq = "=2.12.1"
url = "=2.5.4"
tracing.workspace = true
# STORY-020: Excel .xlsx reading (pure Rust, no C dependencies).
calamine = "=0.26.1"
# STORY-020: SQLite read-only query execution (bundled libsqlite3 for reproducible builds).
rusqlite = { version = "=0.32.0", features = ["bundled"] }
# STORY-020: BLOB column encoding to base64 Value::Str.
base64 = "=0.22.1"

[dev-dependencies]
tempfile = "=3.10.0"
insta = { workspace = true }
tracing-test = "=0.2.5"
# STORY-020: Generate test .xlsx files in memory for unit tests.
rust_xlsxwriter = "=0.64.0"
