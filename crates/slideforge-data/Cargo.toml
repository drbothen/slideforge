[package]
name = "slideforge-data"
description = "DataSource plugin implementations for slideforge — JSON, CSV, YAML, TOML file loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "slideforge_data"

[dependencies]
# All production deps pinned with `=` per supply-chain policy (NFR-025).
slideforge-types.workspace = true
slideforge-plugin-api.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
csv = "=1.3.1"
serde_yaml_ng = "=0.10.0"
toml = { version = "=0.8.23", features = ["preserve_order"] }
thiserror = "=2.0.12"
indexmap = { version = "=2.9.0", features = ["std"] }
ordered-float = "=4.6.0"
ureq = "=2.12.1"
url = "=2.5.4"

[dev-dependencies]
tempfile = "=3.10.0"
insta = { workspace = true }
