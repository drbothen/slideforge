[package]
name = "slideforge-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Math rendering engine for slideforge: LaTeX parser, @{var} interpolation, OMML/MathML output."

[dependencies]
slideforge-types = { workspace = true }
slideforge-plugin-api = { workspace = true }
thiserror = { workspace = true }
# quick-xml: MathML element serialisation (AC-001, STORY-030).
quick-xml = { workspace = true }
# usvg: SVG normalisation to remove <text> elements in PDF path output (AC-003, STORY-030).
usvg = "=0.47.0"

# ab_glyph: real font glyph outlines from Latin Modern Math OTF (AC-003, STORY-030 F-S030-P9-H2).
ab_glyph = "=0.2.32"

[dev-dependencies]
insta = { version = "=1.47.2", features = ["yaml"] }
