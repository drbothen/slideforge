[package]
name = "slideforge-pdf"
description = "PDF export backend for slideforge — pure-Rust via krilla + SlideTagEngine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[lib]
name = "slideforge_pdf"

[dependencies]
# PRIMARY PDF engine — owns page content, text, fonts, tagging, PDF/UA-1.
# pdf-writer =0.14.0 and subsetter =0.2.4 arrive as transitive deps of krilla;
# do NOT add them as direct deps (RISK-1 / RISK-2 per tech-validation.md).
krilla = "=0.6.0"

# Metadata-aware font face resolution — ADR-023 (STORY-081 AC-004).
# Already in Cargo.lock as a transitive dep of usvg =0.47.0; promoting to a
# direct pinned dep does NOT expand the supply chain (same version, already compiled).
# Queries OS/2 table usWeightClass + fsSelection bits — NOT filename heuristics.
# Supply-chain policy NFR-025: exact pin satisfied by "=0.23.0".
fontdb = "=0.23.0"

# Real glyph-metrics width measurement — ADV-P04-CRIT-001 (STORY-081 Pass-4 fix).
# Required to compute per-span horizontal advance (cmap→glyph_id→hmtx advance)
# so that multi-span inline lines have a correct horizontal cursor, preventing
# span overprinting.  Version 0.25.1 is already in Cargo.lock as a transitive dep
# of fontdb; exact-pin per supply-chain policy NFR-025.
ttf-parser = "=0.25.1"

# Structured logging — no println! in library crates (code conventions).
tracing = { workspace = true }

# SVG parsing: usvg parse → krilla Surface path conversion.
# krilla 0.6.0 has NO usvg dependency — zero version conflict.
usvg = { workspace = true }

# Error types
thiserror = { workspace = true }

# Plugin trait — Exporter, ExportError, ExportOptions
slideforge-plugin-api = { workspace = true }

# Semantic IR types — Brand, Deck, NormalizedDiagramSvg, Emu
slideforge-types = { workspace = true }

# Geometric IR types — LaidOutDeck, LaidOutSlide, Frame, FrameContent
slideforge-layout = { workspace = true }

[dev-dependencies]
# For font.rs tests: create temp font files without filesystem coupling.
tempfile = { workspace = true }
# For coords_proptest.rs: property-based testing of coordinate invariants (AC-003, VP-006).
# Pinned per NFR-025 supply-chain policy (dev-only exemption applies; exact pin used anyway).
proptest = "=1.5.0"
