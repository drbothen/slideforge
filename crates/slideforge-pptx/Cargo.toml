[package]
name = "slideforge-pptx"
description = "PPTX exporter plugin for slideforge — ooxmlsdk 0.6.1 + ZIP assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[dependencies]
ooxmlsdk        = { version = "=0.6.1" }
# zip 4.2.0 with lzma/xz disabled to avoid conflict with zip 2.3.0 (used by
# slideforge-brand / slideforge-eval) — both crates link the native `lzma`
# library but through different Rust bindings (lzma-sys vs liblzma-sys).
# PPTX archives only require DEFLATE compression; lzma/xz are not needed.
zip             = { version = "=4.2.0", default-features = false, features = ["deflate", "time"] }
thiserror       = { workspace = true }
tracing         = { workspace = true }
slideforge-types      = { workspace = true }
slideforge-plugin-api = { workspace = true }
slideforge-layout     = { workspace = true }
# ADR-015: slideforge-pptx calls brand XML serializers (serialize_master_to_xml,
# serialize_theme_to_xml, serialize_layout_to_xml). No brand computation is called —
# the exporter consumes pre-serialized bytes only.
slideforge-brand      = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# slideforge-eval with test-utils feature exposes BleedChecker for AC-010 bleed tests.
slideforge-eval = { workspace = true, features = ["test-utils"] }
# sha2 for AC-007 determinism test (SHA-256 byte-identical comparison).
sha2 = { workspace = true }
# tracing-test for load-bearing warn-capture tests (F-P5-LOW-001 partial-reuse warn).
tracing-test = "=0.2.5"
# quick-xml for parsing core.xml and slide XML in a11y tests (BC-4.01.004 / BC-5.01.005).
# Using workspace version (=0.36.0) to avoid a second resolution entry in Cargo.lock.
quick-xml = { workspace = true }
