[package]
name = "slideforge-validate"
description = "Compile-time validation for the slideforge DSL — accessibility, overflow, WCAG AA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[dependencies]
slideforge-types = { workspace = true }
# slideforge-validate uses slideforge-plugin-api's Diagnostic struct directly,
# so no separate error enum is needed. thiserror and miette are intentionally
# absent — errors are expressed via the plugin-api's Diagnostic type.
slideforge-plugin-api = { workspace = true }
# slideforge-layout: required by AltTextValidator::validate_post_layout to iterate
# LaidOutDeck.slides[*].frames for FrameContent::Chart/Image/Diagram with missing
# alt text (ADR-018 Decision 3 post-layout validation pass).
slideforge-layout = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
slideforge-eval = { workspace = true }
slideforge-syntax = { workspace = true }
