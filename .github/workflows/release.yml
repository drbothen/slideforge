name: Release

# Triggered by version tags pushed to main.
# Pattern: v1.2.3 or v0.1.0-alpha.1 etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write   # required to create GitHub Releases and upload assets
  id-token: write   # required for OIDC-based signing (if configured)

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Binary name produced by the CLI crate.
  BINARY_NAME: slideforge

# ─── Pinned action SHAs ──────────────────────────────────────────────────────
#   actions/checkout          v4  → 34e114876b0b11c390a56381ad16ebd13914f8d5
#   Swatinem/rust-cache     v2.9.1  → c19371144df3bb44fab255c43d04cbc2ab54d1c4
#   dtolnay/rust-toolchain  HEAD  → 3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
#   taiki-e/install-action    v2  → d9be7d8cda89035c9c843f78bd44d4f72d8403d4
#   actions/upload-artifact   v4  → ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact v4  → d3f86a106a0bac45b974a628896c90dbdf5c8093
#   softprops/action-gh-release v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
#   anchore/sbom-action       v0  → e22c389904149dbc22b58101806040fa8d37a610
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── Verify CI passes for the tagged commit ─────────────────────────────────
  # Build + test all platforms before producing release artifacts.
  verify:
    name: verify (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "linux-x86_64",   runner: "ubuntu-latest",   rust_target: "x86_64-unknown-linux-gnu"    }
          - { name: "linux-arm64",    runner: "ubuntu-24.04-arm", rust_target: "aarch64-unknown-linux-gnu"   }
          - { name: "macos-arm64",    runner: "macos-latest",    rust_target: "aarch64-apple-darwin"         }
          - { name: "macos-x86_64",   runner: "macos-13",        rust_target: "x86_64-apple-darwin"          }
          - { name: "windows-x86_64", runner: "windows-latest",  rust_target: "x86_64-pc-windows-msvc"      }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ matrix.target.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-verify-${{ matrix.target.name }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4
        with:
          tool: cargo-nextest
      - name: cargo nextest run (final verification)
        run: >
          cargo nextest run
          --workspace
          --all-features
          --no-fail-fast
          --profile ci

  # ─── Build release binaries ─────────────────────────────────────────────────
  # Cross-compile matrix: macOS arm64 + x86_64, Linux x86_64 + arm64, Windows x86_64.
  build:
    name: build (${{ matrix.target.name }})
    needs: verify
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "linux-x86_64"
            runner: "ubuntu-latest"
            rust_target: "x86_64-unknown-linux-gnu"
            artifact_suffix: ""
            cross: false
          - name: "linux-arm64"
            runner: "ubuntu-latest"
            rust_target: "aarch64-unknown-linux-gnu"
            artifact_suffix: ""
            cross: true
          - name: "linux-x86_64-musl"
            runner: "ubuntu-latest"
            rust_target: "x86_64-unknown-linux-musl"
            artifact_suffix: ""
            cross: true
          - name: "macos-arm64"
            runner: "macos-latest"
            rust_target: "aarch64-apple-darwin"
            artifact_suffix: ""
            cross: false
          - name: "macos-x86_64"
            runner: "macos-13"
            rust_target: "x86_64-apple-darwin"
            artifact_suffix: ""
            cross: false
          - name: "windows-x86_64"
            runner: "windows-latest"
            rust_target: "x86_64-pc-windows-msvc"
            artifact_suffix: ".exe"
            cross: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ matrix.target.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: release-build-${{ matrix.target.name }}

      - name: Install cross (cross-compilation tool)
        if: matrix.target.cross == true
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4
        with:
          tool: cross

      - name: Build release binary (native)
        if: matrix.target.cross == false
        run: >
          cargo build
          --release
          --target ${{ matrix.target.rust_target }}
          --package slideforge-cli
          --profile dist

      - name: Build release binary (cross)
        if: matrix.target.cross == true
        run: >
          cross build
          --release
          --target ${{ matrix.target.rust_target }}
          --package slideforge-cli
          --profile dist

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARTIFACT_NAME="${BINARY_NAME}-${TAG}-${{ matrix.target.name }}${{ matrix.target.artifact_suffix }}"
          mkdir -p dist
          cp "target/${{ matrix.target.rust_target }}/dist/${BINARY_NAME}${{ matrix.target.artifact_suffix }}" \
             "dist/${ARTIFACT_NAME}"
          # Generate SHA-256 checksum (NFR-020 supply chain)
          if command -v sha256sum &>/dev/null; then
            sha256sum "dist/${ARTIFACT_NAME}" > "dist/${ARTIFACT_NAME}.sha256"
          else
            # macOS
            shasum -a 256 "dist/${ARTIFACT_NAME}" > "dist/${ARTIFACT_NAME}.sha256"
          fi
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-${{ matrix.target.name }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ─── Generate SBOM ──────────────────────────────────────────────────────────
  # NFR-020: SBOM must be present in release artifacts.
  sbom:
    name: sbom
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: sbom
      - name: Generate SBOM (SPDX format via anchore/sbom-action)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: spdx-json
          output-file: slideforge-${{ github.ref_name }}-sbom.spdx.json
          artifact-name: sbom-${{ github.ref_name }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: slideforge-${{ github.ref_name }}-sbom.spdx.json
          retention-days: 1
          if-no-files-found: error

  # ─── Reproducible-build verification ───────────────────────────────────────
  # NFR-025 (supply chain): confirm the linux-x86_64-gnu binary is bit-for-bit
  # reproducible across two independent builds from the same source commit.
  #
  # Approach: download the artifact produced by the build job, then rebuild
  # the same target from scratch in a fresh environment and compare SHA-256
  # digests.  A mismatch indicates a non-deterministic build (timestamps,
  # embedded paths, random seeds, etc.) that must be fixed before release.
  #
  # Only linux-x86_64-gnu is checked here because:
  #   - Linux/glibc is the most-used target and the easiest to reproduce.
  #   - macOS and Windows runners embed platform-specific signing metadata.
  #   - musl and cross targets are verified indirectly via the same source.
  reproducible-build:
    name: reproducible-build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on real release tags, not on workflow_dispatch dry-runs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      # Deliberately do NOT use rust-cache here: reproducibility check must
      # start from a clean state to catch environment-contamination issues.

      - name: Download linux-x86_64 artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: binary-linux-x86_64
          path: /tmp/first-build/

      - name: Rebuild linux-x86_64 from source (fresh environment)
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --release \
            --target x86_64-unknown-linux-gnu \
            --package slideforge-cli \
            --profile dist
          mkdir -p /tmp/second-build
          cp target/x86_64-unknown-linux-gnu/dist/${BINARY_NAME} \
             /tmp/second-build/${BINARY_NAME}

      - name: Compare SHA-256 hashes (reproducibility gate)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARTIFACT="slideforge-${TAG}-linux-x86_64"

          HASH1=$(sha256sum "/tmp/first-build/${ARTIFACT}" | awk '{print $1}')
          HASH2=$(sha256sum "/tmp/second-build/${BINARY_NAME}" | awk '{print $1}')

          echo "Build 1 SHA-256: ${HASH1}"
          echo "Build 2 SHA-256: ${HASH2}"

          if [ "${HASH1}" != "${HASH2}" ]; then
            echo ""
            echo "REPRODUCIBILITY FAILURE: SHA-256 digests do not match."
            echo "The release binary is not bit-for-bit reproducible."
            echo "Common causes: embedded build timestamps, non-deterministic"
            echo "  codegen, or path-dependent debug info."
            echo "Fix: investigate with 'diffoscope' on the two binaries."
            exit 1
          fi
          echo ""
          echo "REPRODUCIBILITY PASS: both builds produce identical SHA-256 (${HASH1})."

  # ─── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: create-release
    needs: [build, sbom, reproducible-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0    # needed to enumerate commits for release notes

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets/

      - name: Flatten artifact directories into release-assets/
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact job uploaded to its own subdirectory; flatten them.
          find release-assets/ -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets/ -type d -empty -delete
          ls -la release-assets/

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # If CHANGELOG.md exists and contains an entry for this tag, extract it.
          # Otherwise fall back to git log since the previous tag.
          if [ -f CHANGELOG.md ] && grep -q "## \[${TAG}\]" CHANGELOG.md; then
            python3 - <<'PYEOF'
          import re, os
          tag = os.environ['TAG']
          with open('CHANGELOG.md') as f:
              content = f.read()
          # Find the section for this tag
          pattern = rf'(## \[{re.escape(tag)}\].*?)(?=## \[|$)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else f'Release {tag}'
          with open('/tmp/release-notes.md', 'w') as f:
              f.write(notes)
          PYEOF
          else
            # Auto-generate from git log since previous tag
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${TAG}"
            else
              RANGE="${TAG}"
            fi
            echo "## What's Changed" > /tmp/release-notes.md
            git log --pretty=format:"- %s (%h)" "${RANGE}" >> /tmp/release-notes.md || true
            echo "" >> /tmp/release-notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> /tmp/release-notes.md
          fi
          echo "Release notes written to /tmp/release-notes.md"

      - name: Create GitHub Release with binaries and SBOM
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.BINARY_NAME }} ${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
