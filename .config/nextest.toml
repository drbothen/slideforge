# cargo-nextest configuration for slideforge.
#
# Profiles:
#   default — local development (fast feedback, retry on flakes allowed)
#   ci      — CI runs (no retries, JUnit output for test reporting)
#
# Run locally: cargo nextest run
# Run CI:      cargo nextest run --profile ci

# Test group for timing-sensitive tests that must not run concurrently.
# cold_budget measures FONT_DB cold-path latency and is invalidated by CPU
# contention from other tests running in parallel.  max-threads = 1 ensures
# the cold_budget binary is never run at the same time as other tests.
[test-groups.timing-sensitive]
max-threads = 1

[[profile.default.overrides]]
# cold_budget is a timing-sensitive integration test that measures FONT_DB
# cold-path latency. Running it concurrently with the rest of the workspace
# causes CPU starvation and false positives. Assign it to the timing-sensitive
# group so nextest serializes it against the rest of the workspace.
filter = "binary_id(slideforge-diagrams::cold_budget)"
test-group = "timing-sensitive"

[profile.default]
# Local dev: show output for failures only.
failure-output = "immediate"
success-output = "never"
# Allow one retry on flaky tests locally (filesystem-dependent integration tests).
retries = 1

[profile.ci]
# CI: no retries (flaky = broken).
retries = 0
# Show output immediately on failure so the CI log is readable without
# having to scroll to the end.
failure-output = "immediate"
success-output = "never"

[profile.ci.junit]
# Emit JUnit XML for GitHub Actions test reporting integration.
# Output file is written to target/nextest/ci/junit.xml.
# Archived as a workflow artifact if the test job enables that step.
path = "junit.xml"
# Include failure output in JUnit XML for triage (success output omitted to keep artifacts small).
store-success-output = false
store-failure-output = true
