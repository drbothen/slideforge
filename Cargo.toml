# Workspace root Cargo.toml for slideforge.
#
# Replace REPLACE-ME placeholders with real values when scaffolding the
# project (organization name, repository URL, author info).

[workspace]
resolver = "3"
members = [
    "crates/slideforge-types",
    "crates/slideforge-plugin-api",
    "crates/slideforge",
    "crates/slideforge-cli",
    "crates/slideforge-syntax",
    "crates/slideforge-eval",
    "crates/slideforge-layout",
    "crates/slideforge-pptx",
    "crates/slideforge-validate",
    "crates/slideforge-data",
    "crates/slideforge-brand",
    "crates/slideforge-math",
    "crates/slideforge-charts",
    "crates/slideforge-diagrams",
    "crates/slideforge-pdf",      # STORY-043: Phase 4 — PDF core backend
    "crates/slideforge-docx",     # STORY-041: Wave 4 — DOCX core serialization
    "crates/slideforge-html",     # STORY-046: Wave 5 — Static HTML exporter (WCAG AA)
    "crates/slideforge-preview",  # STORY-047: Wave 5 — Live preview server (axum + WebSocket)
]

# Crates that exist as scaffolding but are not built yet (Phase 5+).
# Move into `members` as they are implemented.
exclude = [
    "crates/slideforge-ffi",      # Phase 5
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Joshua Magady <josh.magady@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drbothen/slideforge"
homepage = "https://github.com/drbothen/slideforge"
documentation = "https://docs.rs/slideforge"
readme = "README.md"
keywords = ["pptx", "presentation", "dsl", "powerpoint", "ooxml"]
categories = ["command-line-utilities", "rendering", "text-processing"]

[workspace.dependencies]
# Core dependencies — pinned to exact versions per NFR-025 supply-chain policy.
chumsky = "=0.10.1"
ooxmlsdk = "=0.6.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
miette = { version = "=7.6.0", features = ["fancy"] }
clap = { version = "=4.6.1", features = ["derive", "env"] }
walkdir = "=2.5.0"
notify = "=8.2.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.18"
ordered-float = "=4.6.0"
indexmap = { version = "=2.14.0", features = ["std"] }
anyhow = "=1.0.102"
phf = { version = "=0.11.3", features = ["macros"] }
strsim = "=0.11.1"
plotters = { version = "=0.3.7", default-features = false, features = ["svg_backend", "all_series", "all_elements", "full_palette"] }
quick-xml = "=0.36.0"
mermaid-rs-renderer = { version = "=0.2.2", default-features = false }
usvg = "=0.47.0"
minijinja = "=2.20.0"
html-escape = "=0.2.13"

# Serialization / config
sha2 = "=0.11.0"
toml = { version = "=1.1.2", features = ["preserve_order"] }
toml_edit = "=0.25.12"

# Filesystem / paths
dirs = "=6.0.0"
globset = "=0.4.18"

# Archive / compression
flate2 = "=1.1.9"
tar = "=0.4.46"

# Networking / async runtime (inert until a member consumes them)
axum = { version = "=0.8.9", features = ["ws"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "charset", "http2"] }
tokio = { version = "=1.52.3", default-features = false }
tokio-tungstenite = "=0.29.0"

# Terminal / UI
crossterm = "=0.29.0"

# Observability / OpenTelemetry
opentelemetry = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "=0.32.0", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "=0.33.0"

# SCM / packages
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2", "https"] }

# Miscellaneous utilities
hex = "=0.4.3"
notify-debouncer-full = "=0.7.0"

# Testing (dev-only — exempt from pinning-audit per DEV_ONLY allowlist)
insta = "1"
pretty_assertions = "1"
criterion = { version = "=0.8.2", features = ["html_reports"] }
tempfile = "=3.27.0"
scraper = "=0.27.0"
tracing-test = "=0.2.5"

# Internal workspace crates (referenced as path dependencies from each crate).
slideforge-types = { path = "crates/slideforge-types", version = "0.1.0" }
slideforge-plugin-api = { path = "crates/slideforge-plugin-api", version = "0.1.0" }
slideforge = { path = "crates/slideforge", version = "0.1.0" }
slideforge-syntax = { path = "crates/slideforge-syntax", version = "0.1.0" }
slideforge-eval = { path = "crates/slideforge-eval", version = "0.1.0" }
slideforge-layout = { path = "crates/slideforge-layout", version = "0.1.0" }
slideforge-pptx = { path = "crates/slideforge-pptx", version = "0.1.0" }
slideforge-validate = { path = "crates/slideforge-validate", version = "0.1.0" }
slideforge-data = { path = "crates/slideforge-data", version = "0.1.0" }
slideforge-brand = { path = "crates/slideforge-brand", version = "0.1.0" }
slideforge-math = { path = "crates/slideforge-math", version = "0.1.0" }
slideforge-charts = { path = "crates/slideforge-charts", version = "0.1.0" }
slideforge-diagrams = { path = "crates/slideforge-diagrams", version = "0.1.0" }
slideforge-pdf = { path = "crates/slideforge-pdf", version = "0.1.0" }
slideforge-docx = { path = "crates/slideforge-docx", version = "0.1.0" }
slideforge-html = { path = "crates/slideforge-html", version = "0.1.0" }
slideforge-preview = { path = "crates/slideforge-preview", version = "0.1.0" }

# Release profile tuned for binary size and runtime perf.
#
# IMPORTANT: panic = "unwind" is required by BC-5.02.001 EC-003 / STORY-049 AC-008.
# The plugin dispatch boundary uses `std::panic::catch_unwind` to isolate
# third-party plugin panics from the slideforge process. `catch_unwind` is a
# no-op when `panic = "abort"` is set, which would make EC-003 FALSE in shipped
# builds. Use `panic = "unwind"` so that plugin panics are caught at the
# dispatch boundary, not the OS signal handler.
#
# Binary size impact: unwind tables add ~2-5% to binary size. This is
# acceptable given the safety guarantee (no process crash from plugin panics).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Profile for distribution binaries — smaller, slower link.
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
# Explicit declaration — prevents a future [profile.release] panic=abort edit from
# silently flipping dist to abort. Functionally already unwind via inheritance.
panic = "unwind"

# Dev profile is default but verified explicit for clarity.
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Bench profile inherits release for accurate benchmarks.
[profile.bench]
inherits = "release"

# CI build profile — faster test compilation with usable backtraces.
#
# STORY-093: This profile is a CARGO BUILD PROFILE (invoked with --cargo-profile ci
# in the cargo nextest run command). It is DISTINCT from the nextest execution profile
# (--profile ci), which is defined in .config/nextest.toml. Both flags must be present
# in the nextest invocation for this profile to take effect.
#
# Changes from inherited test profile:
#   debug = "line-tables-only": retains file:line backtrace info while cutting
#     debug-section size substantially. Reduces target/ci/ size vs target/debug/
#     and reduces link time (fewer bytes in the debug section for the linker to
#     process). Per Architecture Compliance Rule 4: "line-tables-only must produce
#     usable backtraces." If test failures show no file:line info, escalate to
#     debug = 1; never use debug = 0 (no info, useless backtraces).
#
# Deliberately omitted (do not add):
#   codegen-units: leave at default (256 for dev/test profile) for maximum
#     parallelism; lowering to 1 or 16 maximizes compile time — the opposite of
#     what we want.
#   incremental: leave unset; enforced via CARGO_INCREMENTAL=0 env var in ci.yml.
#     Setting it here would duplicate the env var and invite confusion.
#   strip: leave unset (defaults to "none" for test profile); stripping test
#     binaries costs time and is not needed for CI artifacts.
#
# Target directory: --cargo-profile ci causes Cargo to build into target/ci/
# instead of target/debug/ or target/test/. The first CI run after this change
# is a cold build for target/ci/; subsequent runs use the cached warm state.
# Total cache budget temporarily increases during one LRU cycle (old target/debug/
# and new target/ci/ both present) before the old entries age out.
[profile.ci]
inherits = "test"
debug = "line-tables-only"
