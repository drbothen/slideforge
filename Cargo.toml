# Workspace root Cargo.toml for slideforge.
#
# Replace REPLACE-ME placeholders with real values when scaffolding the
# project (organization name, repository URL, author info).

[workspace]
resolver = "3"
members = [
    "crates/slideforge-types",
    "crates/slideforge-plugin-api",
    "crates/slideforge",
    "crates/slideforge-cli",
    "crates/slideforge-syntax",
    "crates/slideforge-eval",
    "crates/slideforge-layout",
    "crates/slideforge-pptx",
    "crates/slideforge-validate",
]

# Crates that exist as scaffolding but are not built yet (Phase 4+).
# Move into `members` as they are implemented.
exclude = [
    "crates/slideforge-pdf",      # Phase 4
    "crates/slideforge-html",     # Phase 4
    "crates/slideforge-ffi",      # Phase 5
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Joshua Magady <josh.magady@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drbothen/slideforge"
homepage = "https://github.com/drbothen/slideforge"
documentation = "https://docs.rs/slideforge"
readme = "README.md"
keywords = ["pptx", "presentation", "dsl", "powerpoint", "ooxml"]
categories = ["command-line-utilities", "rendering", "text-processing"]

[workspace.dependencies]
# Core dependencies — pinned to exact versions per NFR-025 supply-chain policy.
chumsky = "=0.10.1"
ooxmlsdk = "=0.6.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
miette = { version = "=7.6.0", features = ["fancy"] }
clap = { version = "=4.6.1", features = ["derive"] }
walkdir = "=2.5.0"
notify = "=6.1.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.12"
ordered-float = "=4.6.0"
indexmap = { version = "=2.9.0", features = ["std"] }
anyhow = "=1.0.102"
phf = { version = "=0.11.3", features = ["macros"] }

# Testing (dev-only — exempt from pinning-audit per DEV_ONLY allowlist)
insta = "1"
pretty_assertions = "1"

# Internal workspace crates (referenced as path dependencies from each crate).
slideforge-types = { path = "crates/slideforge-types", version = "0.1.0" }
slideforge-plugin-api = { path = "crates/slideforge-plugin-api", version = "0.1.0" }
slideforge = { path = "crates/slideforge", version = "0.1.0" }
slideforge-syntax = { path = "crates/slideforge-syntax", version = "0.1.0" }
slideforge-eval = { path = "crates/slideforge-eval", version = "0.1.0" }
slideforge-layout = { path = "crates/slideforge-layout", version = "0.1.0" }
slideforge-pptx = { path = "crates/slideforge-pptx", version = "0.1.0" }
slideforge-validate = { path = "crates/slideforge-validate", version = "0.1.0" }

# Release profile tuned for binary size and runtime perf.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Profile for distribution binaries — smaller, slower link.
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"

# Dev profile is default but verified explicit for clarity.
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Bench profile inherits release for accurate benchmarks.
[profile.bench]
inherits = "release"
